<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowers For You</title>
<style>
  :root {
    --bg-top: #1b1f4b;
    --bg-mid: #0a0d24;
    --bg-bot: #05061a;
    --title: #c79cff;
    --glow: #9b5cff;
    --envelope: #ffb3c1;
    --heart: #ff5f8f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bot) 100%);
    overflow-x: hidden;
  }

  /* ---------- Sky ---------- */
  .stars {
    position: fixed; inset: 0; pointer-events: none; opacity: .85;
    background-image:
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90px 120px, #fff, transparent),
      radial-gradient(1px 1px at 160px 60px, #fff, transparent),
      radial-gradient(1px 1px at 60px 170px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 130px 20px, #fff, transparent);
    background-size: 180px 200px;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .5; } to { opacity: 1; } }

  .shoot {
    position: fixed; top: 10%; left: 0;
    width: 90px; height: 1.5px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #fff);
    opacity: 0; pointer-events: none;
    animation: shoot 6s linear infinite;
  }
  .shoot:nth-of-type(1) { top: 8%;  left: 85%; animation-delay: 0s; }
  .shoot:nth-of-type(2) { top: 30%; left: 70%; animation-delay: 2.5s; }
  .shoot:nth-of-type(3) { top: 55%; left: 10%; animation-delay: 4.2s; }
  @keyframes shoot {
    0%   { opacity: 0; transform: translate(0, 0) rotate(25deg); }
    5%   { opacity: 1; }
    15%, 100% { opacity: 0; transform: translate(300px, 150px) rotate(25deg); }
  }

  /* ---------- Title ---------- */
  h1 {
    position: relative; z-index: 1;
    margin: 12px 0 0;
    text-align: center;
    font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2rem, 10vw, 3rem);
    color: var(--title);
    text-shadow: 0 0 10px var(--glow), 0 0 24px var(--glow);
  }

  /* ---------- Bouquet ---------- */
  .bouquet {
    position: relative; z-index: 1;
    width: min(80vw, 300px);
    aspect-ratio: 3 / 4;
    margin-top: 24px;
  }

  .heads {
    position: absolute; inset: 0;
    overflow: hidden;
    transform-origin: 50% 100%;
    animation: sway 6s ease-in-out infinite alternate;
  }
  @keyframes sway {
    from { transform: rotate(-1.5deg); }
    to   { transform: rotate(1.5deg); }
  }

  .tulip {
    position: absolute;
    left: 50%;
    bottom: 47%;
    width: calc(var(--w) * 1.35);
    height: auto;
    transform: translateX(-50%) rotate(calc(var(--r) * 1.3));
    transform-origin: 50% 97%;
    overflow: visible;
  }

  .wrap {
    position: absolute; bottom: 0; left: 50%;
    width: 44%; height: 52%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #cdb88f, #f1e4c6 50%, #bfa97f);
    clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
  }
  /* Satin ribbon around the paper cone */
  .wrap::after {
    content: "";
    position: absolute; left: 0; right: 0;
    top: 14%; height: 9%;
    background: linear-gradient(#f6a5bd, #e0557f);
    box-shadow: 0 2px 4px rgba(0, 0, 0, .25);
  }

  /* Foliage sits behind the flowers and fans out from the stem base */
  .foliage {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity .8s ease .3s;
  }
  .bouquet.bloomed .foliage { opacity: 1; }

  /* ---------- Envelope ---------- */
  .envelope {
    position: absolute; left: 50%; bottom: 15%;
    width: 50%; aspect-ratio: 1.45;
    transform: translateX(-50%);
    z-index: 3;
    padding: 0; border: 0; border-radius: 6px;
    background: linear-gradient(160deg, #ffd0da 0%, #ffb3c1 55%, #f29fb2 100%);
    box-shadow: 0 12px 22px rgba(0, 0, 0, .45), inset 0 -3px 6px rgba(160, 40, 80, .15);
    cursor: pointer;
    animation: float 3s ease-in-out infinite;
  }
  .envelope:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes float {
    0%, 100% { transform: translate(-50%, 0); }
    50%      { transform: translate(-50%, -4px); }
  }

  /* Flap */
  .envelope::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 60%;
    background: linear-gradient(180deg, #ffe3ea, #ffc2cf);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .6s ease, opacity .6s ease;
  }
  /* Heart seal */
  .envelope::after {
    content: "♥";
    position: absolute; left: 50%; top: 55%;
    transform: translate(-50%, -50%);
    color: var(--heart);
    font-size: 1.4rem;
    text-shadow: 0 0 8px rgba(255, 80, 130, .7);
    transition: opacity .3s ease;
  }
  .bouquet.open .envelope { animation: none; }
  .bouquet.open .envelope::before { transform: rotateX(180deg); opacity: 0; }
  .bouquet.open .envelope::after  { opacity: 0; }

  /* ---------- Heart (first step) ---------- */
  .heart-btn {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    padding: 0; border: 0; background: none;
    color: var(--heart);
    font-size: 6rem; line-height: 1;
    text-shadow: 0 0 18px rgba(255, 95, 143, .8);
    cursor: pointer;
    animation: pulse 1.4s ease-in-out infinite;
    transition: opacity .4s ease, scale .4s ease;
  }
  .heart-btn:focus-visible { outline: 3px solid #fff; outline-offset: 6px; border-radius: 50%; }
  @keyframes pulse {
    0%, 100% { scale: 1; }
    50%      { scale: 1.15; }
  }
  .bouquet.bloomed .heart-btn {
    animation: none;
    opacity: 0; scale: .2;
    pointer-events: none;
  }

  /* ---------- Bloom (second step, after the heart is tapped) ---------- */
  .tulip, .wrap, .envelope {
    transition: scale .7s cubic-bezier(.2, .8, .2, 1) var(--d, 0s),
                opacity .6s ease var(--d, 0s);
  }
  .tulip { scale: 0; opacity: 0; }
  .tulip:nth-child(1) { --d: .25s; }
  .tulip:nth-child(2) { --d: .35s; }
  .tulip:nth-child(3) { --d: .45s; }
  .tulip:nth-child(4) { --d: .55s; }
  .tulip:nth-child(5) { --d: .65s; }
  .tulip:nth-child(6) { --d: .75s; }
  .tulip:nth-child(7) { --d: .85s; }
  .tulip:nth-child(8) { --d: .95s; }
  .tulip:nth-child(9) { --d: 1.05s; }
  .tulip:nth-child(10){ --d: 1.15s; }
  .wrap { opacity: 0; transition: opacity .6s ease .7s; }
  .envelope { opacity: 0; scale: .2; --d: .9s; }
  .bouquet.bloomed .tulip     { scale: 1; opacity: 1; }
  .bouquet.bloomed .wrap      { opacity: 1; }
  .bouquet.bloomed .envelope  { opacity: 1; scale: 1; }
  .bouquet:not(.bloomed) .envelope { pointer-events: none; }

  /* ---------- Letter card ---------- */
  .card {
    position: absolute; left: 50%; bottom: 36%;
    width: 78%;
    padding: 14px 14px 12px;
    background: linear-gradient(170deg, #fffdf8 0%, #fbf3e4 100%); color: #333;
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .4);
    z-index: 2;
    opacity: 0;
    transform: translate(-50%, 30px) scale(.9);
    pointer-events: none;
    transition: opacity .6s ease .3s, transform .8s cubic-bezier(.2, .8, .2, 1) .3s;
  }
  .card::before {
    content: "";
    position: absolute; inset: 6px;
    border: 2px dotted #777;
    border-radius: 4px;
    pointer-events: none;
  }
  .card h2 { margin: 0; font-size: .8rem; color: #222; }
  .card p  { margin: 4px 0 0; font-size: .62rem; line-height: 1.4; }
  .card .bear { display: block; width: 48%; margin: 6px auto 0; }
  .card .foot { margin: 8px 0 0; text-align: left; }

  .bouquet.open .card {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
    pointer-events: auto;
  }

  /* ---------- Balloons (finale) ---------- */
  .balloons {
    position: fixed; inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .balloon {
    position: absolute; left: var(--x); bottom: -90px;
    width: 44px; height: 54px; margin-left: -22px;
    padding: 0; border: 0;
    border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
    background: radial-gradient(ellipse at 34% 28%, rgba(255, 255, 255, .95) 0, var(--c) 32%, color-mix(in srgb, var(--c) 70%, #000) 85%, color-mix(in srgb, var(--c) 45%, #000) 100%);
    box-shadow: inset -6px -8px 10px rgba(0, 0, 0, .18), 0 10px 14px rgba(0, 0, 0, .25);
    cursor: pointer;
    pointer-events: auto;
    animation:
      balloon-rise var(--dur) linear var(--delay) infinite,
      balloon-bob 2.4s ease-in-out infinite alternate;
  }
  .balloon::after {                       /* string */
    content: ""; position: absolute;
    left: 50%; top: 100%;
    width: 1px; height: 50px;
    background: rgba(255, 255, 255, .5);
  }
  .balloon::before {                      /* glossy highlight */
    content: ""; position: absolute;
    left: 20%; top: 12%; width: 20%; height: 26%;
    border-radius: 50%;
    background: rgba(255, 255, 255, .75);
    filter: blur(1px);
    transform: rotate(-22deg);
  }
  .balloon .knot {                        /* tied knot at the bottom */
    position: absolute; left: 50%; top: 100%;
    width: 8px; height: 7px; margin: -3px 0 0 -4px;
    background: var(--c);
    filter: brightness(.7);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  /* Small flower hanging at the end of the balloon string */
  .balloon-flower {
    position: absolute; left: 50%; top: calc(100% + 40px);
    width: 30px; height: 65px;
    transform: translateX(-50%);
    overflow: visible;
    pointer-events: none;
  }
  .balloon:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .balloon.popping { animation: balloon-pop .3s ease-out forwards; }
  @keyframes balloon-rise {
    from { translate: 0 0; }
    to   { translate: 0 -115vh; }
  }
  @keyframes balloon-bob {
    from { transform: translateX(-6px); }
    to   { transform: translateX(6px); }
  }
  @keyframes balloon-pop {
    to { scale: 1.6; opacity: 0; }
  }

  /* Floating reaction emoji after a pop */
  .react {
    position: fixed; z-index: 6;
    font-size: 1.8rem;
    transform: translate(-50%, 0);
    pointer-events: none;
    animation: react-up 1.2s ease-out forwards;
  }
  @keyframes react-up {
    from { opacity: 1; transform: translate(-50%, 0) scale(.6); }
    to   { opacity: 0; transform: translate(-50%, -90px) scale(1.2); }
  }

  /* ---------- Replay ---------- */
  .replay {
    position: relative; z-index: 1;
    margin-top: 20px;
    padding: 10px 22px;
    border: 2px solid var(--title);
    border-radius: 999px;
    background: rgba(155, 92, 255, .2);
    color: #fff;
    font: inherit; font-size: 1rem;
    cursor: pointer;
    opacity: 0; pointer-events: none;
    transform: translateY(10px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .replay.show { opacity: 1; pointer-events: auto; transform: none; }
  .replay:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ---------- Innovations: falling petals, heart burst, sound toggle ---------- */
  .petals { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .petal {
    position: absolute; top: -30px; left: var(--x, 50%);
    width: 14px; height: 18px;
    border-radius: 0 100% 0 100%;
    background: linear-gradient(135deg, #ffd0dc, #e0527a);
    opacity: .85;
    scale: var(--s, 1);
    animation:
      petal-fall var(--dur, 12s) linear var(--delay, 0s) infinite,
      petal-sway 3s ease-in-out infinite alternate;
  }
  @keyframes petal-fall {
    from { translate: 0 0; }
    to   { translate: 0 115vh; }
  }
  @keyframes petal-sway {
    from { transform: translateX(-18px) rotate(0deg); }
    to   { transform: translateX(18px) rotate(180deg); }
  }

  .burst {
    position: fixed; z-index: 7;
    transform: translate(-50%, -50%);
    font-size: 1.2rem;
    pointer-events: none;
    animation: burst 1s ease-out forwards;
  }
  @keyframes burst {
    from { opacity: 1; translate: 0 0; }
    to   { opacity: 0; translate: var(--dx) var(--dy); }
  }

  .sound {
    position: fixed; top: 12px; right: 12px; z-index: 8;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .3);
    background: rgba(20, 20, 50, .5);
    color: #fff; font-size: 1.1rem;
    cursor: pointer;
  }
  .sound[aria-pressed="false"] { opacity: .5; }
  .sound:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .petals, .burst { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

  <div class="petals" id="petals" aria-hidden="true"></div>
  <div class="balloons" id="balloons" aria-hidden="true"></div>
  <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Sound on">♪</button>

        <stop offset="1"   stop-color="#5e2296"/>
      </linearGradient>

  <h1>Flowers For You</h1>

  <section class="bouquet" id="bouquet">
    <button class="heart-btn" id="heart" type="button" aria-label="Reveal the flowers">♥</button>
    <svg class="foliage" viewBox="0 0 300 400" aria-hidden="true">
      <use href="#leaf-shape"transform="translate(150 212) rotate(-100) scale(.8)"/>
      <use href="#leaf-shape"transform="translate(150 212) rotate(100) scale(.8)"/>

    <div class="heads">

    <article class="card" id="card" aria-hidden="true">
      <h2>Dear Love</h2>
      <p>Today is not a special date, but for me it is a unique day.</p>

      <svg class="bear" viewBox="0 0 120 100" role="img" aria-label="Cartoon bear hugging a panda">
        <!-- brown bear -->
        <ellipse cx="42" cy="62" rx="22" ry="27" fill="#e9a06b" stroke="#5a3a22" stroke-width="2"/>
        <circle  cx="38" cy="30" r="18" fill="#e9a06b" stroke="#5a3a22" stroke-width="2"/>
        <circle  cx="26" cy="15" r="5"  fill="#e9a06b" stroke="#5a3a22" stroke-width="2"/>

        <!-- panda -->
        <ellipse cx="82" cy="64" rx="19" ry="24" fill="#fff" stroke="#333" stroke-width="2"/>

        <!-- hearts -->
        <text x="58" y="10" font-size="10" fill="#f48fb1">♥</text>

      <p class="foot">I like you just the way you are. Happy month.</p>

    <button class="envelope" id="envelope" type="button"
            aria-expanded="false" aria-controls="card" aria-label="Open the letter"></button>
  </section>

  <button class="replay" id="replay" type="button">Replay ↺</button>

<script>
  (function () {
    var bouquet  = document.getElementById('bouquet');
    var envelope = document.getElementById('envelope');
    var card     = document.getElementById('card');

    var balloons = document.getElementById('balloons');
    var replayBtn = document.getElementById('replay');
    var heart = document.getElementById('heart');
    var timers = [];
    var celebrated = false;

    var colors = ['#ff6b9a', '#ffd166', '#7bdff2', '#b388ff', '#8ef5a6', '#ff9e6d'];
    var reactions = ['❤️', '😍', '🥰', '✨', '💜'];

    function spawnBalloons() {
      for (var i = 0; i < 14; i++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'balloon';
        b.setAttribute('aria-label', 'Pop balloon');
        b.style.setProperty('--x', (5 + Math.random() * 90) + '%');
        b.style.setProperty('--c', colors[i % colors.length]);
        b.style.setProperty('--dur', (7 + Math.random() * 6) + 's');
        b.style.setProperty('--delay', (-Math.random() * 10) + 's');
        var knot = document.createElement('i');
        knot.className = 'knot';
        b.appendChild(knot);
        var flower = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        flower.setAttribute('viewBox', '0 0 60 130');
        flower.setAttribute('class', 'balloon-flower');
        flower.setAttribute('aria-hidden', 'true');
        var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        use.setAttribute('href', i % 2 ? '#rose' : '#tulip-shape');
        flower.appendChild(use);
        b.appendChild(flower);
        b.addEventListener('click', popBalloon);
        balloons.appendChild(b);
      }
    }

    function popBalloon(e) {
      var b = e.currentTarget;
      if (b.classList.contains('popping')) return;
      b.classList.add('popping');
      b.addEventListener('animationend', function () { b.remove(); }, { once: true });

      var r = b.getBoundingClientRect();
      var react = document.createElement('span');
      react.className = 'react';
      react.textContent = reactions[Math.floor(Math.random() * reactions.length)];
      react.style.left = (r.left + r.width / 2) + 'px';
      react.style.top = r.top + 'px';
      document.body.appendChild(react);
      react.addEventListener('animationend', function () { react.remove(); });
    }

    function toggle() {
      var open = bouquet.classList.toggle('open');
      envelope.setAttribute('aria-expanded', String(open));
      envelope.setAttribute('aria-label', open ? 'Close the letter' : 'Open the letter');
      card.setAttribute('aria-hidden', String(!open));

      if (open && !celebrated) {
        celebrated = true;
        timers.push(setTimeout(spawnBalloons, 900));
        timers.push(setTimeout(function () { replayBtn.classList.add('show'); }, 1400));
      }
    }

    envelope.addEventListener('click', toggle);

    heart.addEventListener('click', function () {
      bouquet.classList.add('bloomed');
      heart.setAttribute('aria-hidden', 'true');
      heart.tabIndex = -1;
    });

    replayBtn.addEventListener('click', function () {
      timers.forEach(clearTimeout);
      timers = [];
      celebrated = false;

      bouquet.classList.remove('open', 'bloomed');
      envelope.setAttribute('aria-expanded', 'false');
      envelope.setAttribute('aria-label', 'Open the letter');
      card.setAttribute('aria-hidden', 'true');

      balloons.innerHTML = '';
      replayBtn.classList.remove('show');

      heart.removeAttribute('aria-hidden');
      heart.tabIndex = 0;
      heart.focus();
    });
  })();
(function () {
  var heart = document.getElementById('heart');
  var envelope = document.getElementById('envelope');
  var bouquet = document.getElementById('bouquet');
  var card = document.getElementById('card');
  var petalsLayer = document.getElementById('petals');
  var soundBtn = document.getElementById('sound');

  var soundOn = true;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cardText = card.querySelector('p:not(.foot)');
  var footText = card.querySelector('.foot');
  var T1 = 'Today is not a special date, but for me it is a unique day.';
  var T2 = 'I like you just the way you are. Happy month.';
  var petalsSpawned = false;

  /* Soft chime made with Web Audio (no external file) */
  function chime() {
    if (!soundOn) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        var t = ctx.currentTime + i * 0.12;
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 1.3);
      });
      setTimeout(function () { ctx.close(); }, 2000);
    } catch (e) { /* audio unavailable: stay silent */ }
  }

  /* Hearts explode outward from the heart button */
  function heartBurst() {
    var r = heart.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var colors = ['#ff5f8f', '#ffb3c6', '#c79cff', '#ffd166'];
    for (var i = 0; i < 14; i++) {
      var s = document.createElement('span');
      var a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
      s.className = 'burst';
      s.textContent = '♥';
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      s.style.color = colors[i % colors.length];
      s.style.setProperty('--dx', Math.cos(a) * d + 'px');
      s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(s);
      s.addEventListener('animationend', function (e) { e.currentTarget.remove(); });
    }
  }

  /* Petals drifting down the background */
  function spawnPetals() {
    for (var i = 0; i < 16; i++) {
      var p = document.createElement('span');
      p.className = 'petal';
      p.style.setProperty('--x', (Math.random() * 100) + '%');
      p.style.setProperty('--dur', (9 + Math.random() * 7) + 's');
      p.style.setProperty('--delay', (-Math.random() * 16) + 's');
      p.style.setProperty('--s', String(0.6 + Math.random() * 0.7));
      petalsLayer.appendChild(p);
    }
  }

  /* ---------- Continuous romantic music (generated with Web Audio) ---------- */
  /* Loop: C - Am - F - G, soft pad chords + a gentle melody over a light reverb. */
  var audio = null;
  var BPM = 72, BEAT = 60 / BPM, BAR = BEAT * 4;
  var CHORDS = [[48, 55, 60, 64], [45, 52, 57, 60], [41, 48, 53, 57], [43, 50, 55, 59]];
  var LEAD   = [[76, 79, 84, 79], [81, 84, 88, 84], [77, 81, 84, 81], [79, 83, 86, 91]];

  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function makeReverb(ctx) {
    var len = ctx.sampleRate * 3;
    var buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    var conv = ctx.createConvolver();
    conv.buffer = buf;
    return conv;
  }

  function note(ctx, dest, freq, t, dur, type, peak, attack) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function scheduleMusic() {
    var a = audio;
    if (!a) return;
    while (a.nextTime < a.ctx.currentTime + 0.6) {
      var t0 = a.nextTime, k = a.bar % 4;
      CHORDS[k].forEach(function (m) {
        note(a.ctx, a.out, mtof(m), t0, BAR + 0.6, 'sine', 0.05, 0.8);
      });
      LEAD[k].forEach(function (m, i) {
        note(a.ctx, a.out, mtof(m), t0 + i * BEAT, BEAT * 1.8, 'triangle', 0.12, 0.03);
      });
      a.nextTime += BAR;
      a.bar++;
    }
  }

  function startMusic() {
    if (audio) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      var master = ctx.createGain();
      master.gain.value = soundOn ? 0.22 : 0;
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2200;
      var verb = makeReverb(ctx);
      var verbGain = ctx.createGain();
      verbGain.gain.value = 0.35;
      lp.connect(master);
      lp.connect(verb); verb.connect(verbGain); verbGain.connect(master);
      master.connect(ctx.destination);
      audio = { ctx: ctx, master: master, out: lp, nextTime: ctx.currentTime + 0.3, bar: 0 };
      scheduleMusic();
      audio.timer = setInterval(scheduleMusic, 150);
    } catch (e) { /* audio unavailable: stay silent */ }
  }

  function setMusicOn(on) {
    if (audio) audio.master.gain.setTargetAtTime(on ? 0.22 : 0, audio.ctx.currentTime, 0.15);
  }

  /* Typewriter effect for the letter */
  function typeInto(el, text, speed, done) {
    if (reduce) { el.textContent = text; if (done) done(); return; }
    el.textContent = '';
    var i = 0;
    var t = setInterval(function () {
      el.textContent = text.slice(0, ++i);
      if (i >= text.length) { clearInterval(t); if (done) done(); }
    }, speed);
  }

  heart.addEventListener('click', function () {
    chime();
    startMusic();
    heartBurst();
    if (!petalsSpawned) { petalsSpawned = true; spawnPetals(); }
  });

  envelope.addEventListener('click', function () {
    /* the main script has already toggled 'open' on this click */
    if (bouquet.classList.contains('open')) {
      typeInto(cardText, T1, 32, function () { typeInto(footText, T2, 22); });
    }
  });

  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
    setMusicOn(soundOn);
  });
})();
</script>
