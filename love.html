<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This is my love for Fortuné</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #000;
  --text: #f2f2f2;
  --accent: #ff3d6e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
}

body {
  font-family: Nunito, system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

.page {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  display: flex;
}

/* ---------- Scène animée ---------- */
.stage {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 560px;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #1c0510 0%, #000 65%);
}

/* CSS visible dans la vidéo */
.coil {
  position: absolute;
  left: 50%;
  top: 40%;
  width: 8em;
  height: 8em;
  margin-left: -4em;
  margin-top: -4em;
  font-size: min(45px, 11vw);
  cursor: pointer;
  animation: jolt 3s linear infinite;
}

.coil-track {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.coil-track path {
  fill: none;
  stroke: hsla(250, 15%, 12%, 0.08);
  stroke-width: 16;
  stroke-linecap: round;
  transition: stroke 0.3s;
}

.coil:hover .coil-track path {
  stroke: hsla(340, 90%, 50%, 0.12);
}

/* Secousse du conteneur (animation « jolt », 3s linéaire, infinie) */
@keyframes jolt {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  10%      { transform: translate(-1px, 1px) rotate(-0.3deg); }
  20%      { transform: translate(1px, -1px) rotate(0.3deg); }
  30%      { transform: translate(0, 0) rotate(0deg); }
  50%      { transform: translate(1px, 0) rotate(0.2deg); }
  70%      { transform: translate(-1px, 0) rotate(-0.2deg); }
}

.words {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
}

.w {
  position: absolute;
  left: 0;
  top: 0;
  white-space: nowrap;
  font-weight: 800;
  line-height: 1;
  text-shadow: 0 0 8px rgba(255, 40, 100, 0.55);
  will-change: transform;
}

/* Légende */
.caption {
  position: absolute;
  left: 0;
  right: 0;
  top: 76%;
  text-align: center;
  pointer-events: none;
  z-index: 1000;
}

.kicker {
  font-size: 14px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #dcdce2;
  font-weight: 600;
}

.sig {
  font-family: 'Dancing Script', cursive;
  font-size: 40px;
  line-height: 1.2;
  color: #fff;
  margin-top: 2px;
}

.sig b {
  color: var(--accent);
  font-weight: 700;
}

.sig svg {
  width: 26px;
  height: 26px;
  vertical-align: middle;
  margin-left: 8px;
  filter: drop-shadow(0 0 8px rgba(255, 40, 100, 0.8));
}
</style>
</head>
<body>
<div class="page">

  <section class="stage" aria-label="This is my love for Fortuné">
    <div class="coil" aria-hidden="true">
      <svg class="coil-track" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="M50 88C20 65 5 45 10 28 16 10 40 8 50 28 60 8 84 10 90 28 95 45 80 65 50 88Z"/>
      </svg>
      <div class="words" id="words"></div>
    </div>

    <div class="caption">
      <div class="kicker">THIS IS MY LOVE</div>
      <div class="sig">for <b>Fortuné</b>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <radialGradient id="hg" cx=".35" cy=".3" r=".8">
              <stop offset="0" stop-color="#ff8fb0"/>
              <stop offset=".5" stop-color="#ff2e63"/>
              <stop offset="1" stop-color="#9b0f3a"/>
            </radialGradient>
          </defs>
          <path fill="url(#hg)" d="M12 21s-7.5-4.6-9.6-9.1C.9 8.6 2.8 4.5 6.7 4.5c2.2 0 3.6 1.3 5.3 3.1 1.7-1.8 3.1-3.1 5.3-3.1 3.9 0 5.8 4.1 4.3 7.4C19.5 16.4 12 21 12 21z"/>
        </svg>
      </div>
    </div>
  </section>

</div>

<script>
(() => {
  const coil  = document.querySelector('.coil');
  const words = document.getElementById('words');

  const TEXTS = ['I love you', 'te amo', "je t'aime", 'forever', 'always',
                 'sweetheart', 'me & you', 'love', 'you'];
  const HUES  = [330, 340, 348, 355];
  const N     = 150;     // nombre de mots
  const CYCLE = 12;      // secondes : cœur -> spirale -> éparpillement -> cœur

  // Générateur pseudo-aléatoire déterministe : la mise en page est toujours identique
  let seed = 20260211;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const items = [];
  for (let i = 0; i < N; i++) {
    const el = document.createElement('span');
    el.className = 'w';
    el.textContent = TEXTS[Math.floor(rnd() * TEXTS.length)];
    words.appendChild(el);
    items.push({
      el,
      u: i / N,                       // position le long de la courbe
      onEdge: rnd() < 0.55,           // contour du cœur ou remplissage
      fillR: rnd(),
      size: rnd(),
      hue: HUES[Math.floor(rnd() * HUES.length)],
      rx: rnd() * 2 - 1,
      ry: rnd() * 2 - 1,
      rz: rnd() * 2 - 1,
    });
  }

  // Rayon d'un "pixel logique" : la boîte .coil (8em) couvre ~40 unités
  let R = 9;
  const layout = () => { R = coil.clientWidth / 40; };
  layout();
  window.addEventListener('resize', layout);

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed  = reduce ? 0 : 1;

  // Calcule la position 3D d'un mot (unités logiques)
  function position(it, time, out) {
    const t = it.u * Math.PI * 2;
    const s = Math.sin(t), c = Math.cos(t);

    // 1) Cœur
    const fill = it.onEdge ? 0.97 + 0.05 * it.rx
                           : 0.15 + 0.85 * Math.sqrt(it.fillR);
    const hx = 16 * s * s * s * fill;
    const hy = -(13 * c - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * fill;
    const hz = 3 * Math.sin(2 * t) * it.rz;

    // 2) Ressort (coil) qui tourne
    const a  = t * 3 + time * 0.9;
    const cx = 10 * Math.cos(a);
    const cz = 10 * Math.sin(a);
    const cy = (it.u - 0.5) * 34;

    // 3) Éparpillement
    const dr = Math.sin(time * 1.3 + it.u * 20) * 1.2;
    const sx = it.rx * 14 + dr;
    const sy = it.ry * 13 - dr;
    const sz = it.rz * 12;

    // Fondu entre les états
    const p = ((time % CYCLE) / CYCLE);
    const h = 0.5 + 0.5 * Math.cos(2 * Math.PI * p);   // 1 = cœur
    const k = Math.pow(Math.abs(Math.sin(2 * Math.PI * p)), 2) * 0.7;  // éparpillement

    const x = (hx * h + cx * (1 - h)) * (1 - k) + sx * k;
    const y = (hy * h + cy * (1 - h)) * (1 - k) + sy * k;
    const z = (hz * h + cz * (1 - h)) * (1 - k) + sz * k;

    // Léger balancement autour de l'axe vertical
    const th = 0.35 * Math.sin(time * 0.6);
    out.x = x * Math.cos(th) + z * Math.sin(th);
    out.y = y;
    out.z = -x * Math.sin(th) + z * Math.cos(th);
  }

  const pos = { x: 0, y: 0, z: 0 };
  const t0 = performance.now();

  function frame(now) {
    const time = ((now - t0) / 1000) * speed;

    for (const it of items) {
      position(it, time, pos);

      const persp = 40 / (40 - pos.z);             // perspective
      const x = pos.x * R * persp;
      const y = pos.y * R * persp;
      const depth = Math.min(1, Math.max(0, (pos.z + 14) / 28));

      it.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -50%)`;
      it.el.style.fontSize  = ((6 + 11 * it.size * it.size) * persp * (R / 9)).toFixed(1) + 'px';
      it.el.style.opacity   = (0.22 + 0.78 * depth).toFixed(2);
      it.el.style.zIndex    = Math.round(pos.z * 10 + 500);
      it.el.style.color     = `hsl(${it.hue} 92% ${Math.round(45 + depth * 20)}%)`;
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
